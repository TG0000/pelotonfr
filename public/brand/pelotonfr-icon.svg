<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e50c8"/>
      <stop offset="100%" stop-color="#0f2f8a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Peloton: three riders in echelon, the leading one detached -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- rear wheel + front wheel of the lead rider -->
    <circle cx="176" cy="330" r="62" stroke-width="22"/>
    <circle cx="352" cy="330" r="62" stroke-width="22"/>
    <!-- frame -->
    <path d="M176 330 L232 214 L318 214 L352 330 M232 214 L286 330 L176 330" stroke-width="20"/>
    <!-- handlebar -->
    <path d="M318 214 L344 176 L392 176" stroke-width="20"/>
  </g>

  <!-- Motion marks, suggesting the bunch behind -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="18" opacity="0.45">
    <path d="M74 214 L146 214"/>
    <path d="M54 268 L118 268"/>
  </g>
</svg>
