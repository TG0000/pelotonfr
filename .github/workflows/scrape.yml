name: Daily Race Scraper

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      federation:
        description: 'Limit to one federation (ffc, fsgt, ufolep). Leave empty for all.'
        required: false
        type: string

# A second run starting while the first is still writing would fight over the
# same rows; queue them instead.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Calendar, results, rankings, start lists, categories, alerts: forty
    # minutes on a normal night. Everything that only enriches a race runs in
    # its own job below, so that nothing here waits on a slow read.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ inputs.federation }}" ]; then
            npm run scrape -- --only=${{ inputs.federation }}
          else
            npm run scrape
          fi

      # The federation leaves some towns as "Lieu à préciser" while the race
      # name starts with the town; and it files randonnées under "Route". Both
      # are read from the name, after the calendar has been refreshed.
      - name: Place unplaced races and set cyclosportives apart
        if: ${{ !inputs.federation }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run db:place
          npm run db:place-check
          npm run scrape:briefing -- --categories --limit=150
          # La fédération écrit la catégorie dans le nom de la course : c'est
          # le seul énoncé qui ne parle que d'elle, et il reprend la main sur
          # ce qu'une fiche — qui décrit tous les pelotons du jour — a pu poser.
          npm run db:recompute-categories
          npm run db:retype-cyclos
          # Each race meets its previous edition: same village, same week, same discipline.
          npm run db:link-editions
          npm run db:guard
        continue-on-error: true

      # The calendar only serves the future, so races that have just taken place
      # are re-discovered through the results index before their classifications
      # are fetched.
      - name: Discover recently finished races
        if: ${{ !inputs.federation || inputs.federation == 'ffc' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape:history -- --days=21 --max-pages=80

      - name: Ingest published results
        if: ${{ !inputs.federation || inputs.federation == 'ffc' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run scrape:results -- --limit=400
          # A classification often appears days after the race: a page read
          # once and found empty is read again for a fortnight.
          npm run scrape:results -- --force --max-age=14 --limit=300

      # Only the running season is refreshed daily; closed seasons never change,
      # and back-filling them is a one-off (npm run scrape:rankings -- --seasons=…).
      - name: Refresh the current national rankings
        if: ${{ !inputs.federation || inputs.federation == 'ffc' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape:rankings -- --current

      # Start lists appear one to three days before a race, so this has to run
      # nightly to catch them while they still matter.
      - name: Collect published start lists
        if: ${{ !inputs.federation }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape:engagements -- --pages=4

      # The climbs around each race live in their own workflow (segments.yml):
      # at nine and a half seconds a Strava read, a nightly budget takes over
      # two hours, and for sixteen nights that step was killed by this job's
      # timeout — taking the categories and the alert digests down with it.

      # Categories for FSGT and UFOLEP, which their own calendar never states.
      - name: Enrich categories
        if: ${{ !inputs.federation }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape:categories

      # Runs last: alerts should describe the calendar as it stands after the
      # night's scrape, not as it stood before.
      - name: Send alert digests
        if: ${{ !inputs.federation }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ secrets.BREVO_FROM_EMAIL }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_REPLY_TO: ${{ secrets.ALERT_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://pelotonfr.com
        run: npm run alerts:send
      - name: Send closing notices
        if: ${{ !inputs.federation }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ secrets.BREVO_FROM_EMAIL }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_REPLY_TO: ${{ secrets.ALERT_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SITE_URL: https://pelotonfr.com
        run: npm run alerts:closing

      # The collectors now record every run, so a step that is skipped or
      # never reached shows up as an ageing source rather than as silence.
      # The watchdog that reads those rows runs on Vercel Cron, deliberately
      # outside this workflow: an alarm inside the thing it watches switches
      # off with it, which is how this job went 73 days unnoticed.

      # A run killed by its own timeout is "cancelled", not "failed", and for
      # sixteen nights that distinction was the difference between an issue
      # and silence.
      - name: Open issue on failure
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const title = `Scraper failed on ${date}`;

            // Avoid piling up one issue per day for the same ongoing breakage.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scraper',
            });
            if (existing.some((i) => i.title === title)) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'The daily race scraper failed.',
                '',
                `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
              labels: ['bug', 'scraper'],
            });

  # What only enriches a race — organiser pages, posters, guides, weather —
  # runs beside the calendar job, not behind it: a slow read here must never
  # delay the alerts. It reads the races the calendar knew last night, which
  # is a night late for a brand-new race and correct for every other.
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !inputs.federation }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # What the organiser wrote on their own page: dossards, circuit, stages.
      # A page is read once, so a night's work is the new races only.
      - name: Read organiser pages
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run scrape:briefing -- --limit=150
          # The entries counter moves every day until entries close: re-read
          # the next ten days for that number alone.
          npm run scrape:briefing -- --places --limit=800
        continue-on-error: true

      # Posters and technical guides, read by a vision model. Each image is
      # read once and stored for good; the scripts do nothing without the key.
      - name: Read posters and technical guides
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
        run: |
          npm run scrape:affiches -- --limit=30
          npm run scrape:guides -- --limit=30
          npm run scrape:guides:vision -- --limit=40
          npm run scrape:road:vision -- --limit=40
          npm run scrape:streetview -- --limit=60
        continue-on-error: true

      # The weather at the start, for the coming week, so the list can show it.
      - name: Forecast the coming week
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape:meteo
        continue-on-error: true

