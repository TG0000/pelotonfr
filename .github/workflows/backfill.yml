name: Backfill past seasons

# Manual only, and deliberately separate from the nightly job.
#
# HOW FAR THIS CAN GO. The FFC results index serves roughly the current season
# and the one before it — measured by bisection, it answers for 01/05/2025 and
# returns empty pages for 15/04/2025. Verified again in August 2026: still true. The 2021 category reform is out of reach
# from this source whatever `days` is set to, and the scraper clamps rather than
# walking empty pages for hours. Deeper history needs the per-rider palmarès
# route instead.
#
# What is reachable is still worth an hour: about sixteen months, which is what
# lets a meeting see its previous edition. Races already held are skipped by
# content hash, so a slice that times out is simply run again.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How far back to walk, in days. The index reaches about 490; beyond that it is clamped.'
        required: true
        default: '490'
        type: string
      results_limit:
        description: 'How many races to fetch classifications for in this run.'
        required: true
        default: '800'
        type: string

# One at a time: two runs walking the same index would fight over the same rows.
concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Discover past races
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape:history -- --days=${{ inputs.days }} --max-pages=4000

      - name: Ingest their classifications
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Same reach as the discovery walk, or the classifications step skips
        # every race the walk just brought back: the nightly job's four-hundred
        # day guard is right for a nightly job and wrong for a reprise.
        run: npm run scrape:results -- --limit=${{ inputs.results_limit }} --max-age=${{ inputs.days }}

      # The whole point of reaching back is linking editions to each other, and
      # that link is only made when identities are recomputed over the new rows.
      - name: Rebuild meeting identities
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:reidentify

      - name: Report what the archive now holds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:archive-report
