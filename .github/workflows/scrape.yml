name: Daily Race Scraper

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      federation:
        description: 'Limit to one federation (ffc, fsgt, ufolep). Leave empty for all.'
        required: false
        type: string

# A second run starting while the first is still writing would fight over the
# same rows; queue them instead.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Run scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ inputs.federation }}" ]; then
            npm run scrape -- --only=${{ inputs.federation }}
          else
            npm run scrape
          fi

      # The calendar only serves the future, so races that have just taken place
      # are re-discovered through the results index before their classifications
      # are fetched.
      - name: Discover recently finished races
        if: ${{ !inputs.federation || inputs.federation == 'ffc' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape:history -- --days=21 --max-pages=80

      - name: Ingest published results
        if: ${{ !inputs.federation || inputs.federation == 'ffc' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run scrape:results -- --limit=400

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const title = `Scraper failed on ${date}`;

            // Avoid piling up one issue per day for the same ongoing breakage.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scraper',
            });
            if (existing.some((i) => i.title === title)) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'The daily race scraper failed.',
                '',
                `[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
              labels: ['bug', 'scraper'],
            });
